version: 2
updates:
  # Gradle build: Loom, Stonecutter, minotaur, foojay resolver, etc.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      gradle-plugins:
        patterns:
          - "*"

  # MCP server (npm) dependencies.
  - package-ecosystem: "npm"
    directory: "/mcp-server"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # ext-apps 2.x needs the split MCP SDK v2 (@modelcontextprotocol/server, ...);
      # we are on @modelcontextprotocol/sdk 1.x. Drop this when we migrate to SDK v2.
      - dependency-name: "@modelcontextprotocol/ext-apps"
        update-types: ["version-update:semver-major"]

  # GitHub Actions used by the build and release workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      # init and analyze must run the same CodeQL version, so bump them together.
      codeql-action:
        patterns:
          - "github/codeql-action/*"
